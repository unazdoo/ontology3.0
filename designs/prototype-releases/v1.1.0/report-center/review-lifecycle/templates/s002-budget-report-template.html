<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预算监督管理分析模板</title><style>:root{font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#182536;background:#edf2f6}*{box-sizing:border-box}body{margin:0}.paper{width:min(900px,calc(100% - 32px));margin:24px auto;padding:52px 60px;background:#fff;box-shadow:0 15px 45px #1734511f}.head{padding-bottom:28px;border-bottom:5px solid #24577a}.head small{color:#24577a;font-weight:800}.head h1{margin:10px 0 5px;font-size:30px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}.meta div,.slot{padding:12px;border:1px solid #dce5ec;background:#f8fafc}.section{padding:26px 0;border-bottom:1px solid #dfe6ec}.section h2{margin:0 0 10px;color:#24577a}.slot{color:#667788}@media(max-width:700px){.paper{width:100%;margin:0;padding:28px 20px}.meta{grid-template-columns:1fr}}@media print{body{background:#fff}.paper{width:100%;margin:0;box-shadow:none}}</style></head><body><main class="paper"><header class="head"><small>智财问策 · 报告模板</small><h1>预算监督管理分析报告</h1><p>模板版本 1.0.0</p><div class="meta"><div>报告编号 / 内容版本</div><div>报告对象 / 报告期间</div><div>数据版本 / 数据截至</div><div>复核人 / 发布时间</div></div></header><section class="section"><h2>一、预算执行概览</h2><div class="slot">集团与部门指标、执行率和同比趋势</div></section><section class="section"><h2>二、申报与批准</h2><div class="slot">初始申报、调整版本与最终批准对照</div></section><section class="section"><h2>三、项目余额与采购占用</h2><div class="slot">项目余额、在途采购和释放计划</div></section><section class="section"><h2>四、费用、差旅与供应商</h2><div class="slot">费用结构、差旅强度和供应商价格比较</div></section><section class="section"><h2>五、异常与建议</h2><div class="slot">规则发现、业务解释、责任环节与证据</div></section></main></body></html>
