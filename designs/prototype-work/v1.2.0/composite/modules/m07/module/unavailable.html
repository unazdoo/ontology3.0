<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>多视图资源未登记 · 智财问策</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif; background: #f4f6f8; color: #1f2a36; }
    * { box-sizing: border-box; }
    body { min-width: 0; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(620px, 100%); display: grid; justify-items: start; gap: 14px; }
    .mark { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid #aec0d1; border-radius: 6px; background: #e7eef5; color: #315f88; font-size: 18px; font-weight: 700; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; line-height: 1.35; letter-spacing: 0; }
    p { margin: 0; color: #5d6b79; font-size: 14px; line-height: 1.75; }
    dl { width: 100%; margin: 4px 0 0; display: grid; border-top: 1px solid #d9e0e7; }
    dl div { min-width: 0; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid #d9e0e7; }
    dt { color: #697887; font-size: 12px; }
    dd { min-width: 0; margin: 0; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
    button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0 16px; border: 1px solid #315f88; border-radius: 5px; background: #315f88; color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { background: #244d70; }
    button:focus-visible { outline: 3px solid rgba(49, 95, 136, .25); outline-offset: 2px; }
    @media (max-width: 520px) { body { place-items: start; padding: 28px 18px; } dl div { grid-template-columns: 1fr; gap: 4px; } button { width: 100%; } }
  </style>
</head>
<body>
  <main data-screen-label="M07 多视图资源未登记">
    <span class="mark" aria-hidden="true">M07</span>
    <h1>当前场景尚未登记多视图资源</h1>
    <p>该场景的归档记录保持只读。本页面不会改用其他场景的数据。</p>
    <dl>
      <div><dt>场景</dt><dd id="scenario-id">未提供</dd></div>
      <div><dt>状态</dt><dd>未登记</dd></div>
    </dl>
    <button id="open-data" type="button">查看数据目录</button>
  </main>
  <script>
    (function () {
      "use strict";
      const scenarioId = new URLSearchParams(location.search).get("scenarioId") || "未提供";
      document.getElementById("scenario-id").textContent = scenarioId;
      document.getElementById("open-data").addEventListener("click", function () {
        const message = {
          channel: "ofw.m07.prototype.handoff.v1",
          operation: "navigate-parent-module",
          moduleId: "data",
          route: "#module/data",
          sourceModuleId: "m07",
          sourceRoute: "#module/m07",
          scenarioId
        };
        if (window.parent !== window) window.parent.postMessage(message, window.location.origin);
        else window.dispatchEvent(new CustomEvent("m07:handoff", { detail: message }));
      });
    }());
  </script>
</body>
</html>
