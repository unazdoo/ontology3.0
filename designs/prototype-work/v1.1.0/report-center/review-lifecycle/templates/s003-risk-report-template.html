<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业债务风险评估模板</title><style>:root{font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#182536;background:#edf2f6}*{box-sizing:border-box}body{margin:0}.paper{width:min(900px,calc(100% - 32px));margin:24px auto;padding:52px 60px;background:#fff;box-shadow:0 15px 45px #1734511f}.head{padding-bottom:28px;border-bottom:5px solid #174e7b}.head small{color:#2f6d9c;font-weight:800}.head h1{margin:10px 0 5px;font-size:30px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}.meta div,.slot{padding:12px;border:1px solid #dce5ec;background:#f8fafc}.section{padding:24px 0;border-bottom:1px solid #dfe6ec}.section h2{margin:0 0 10px;color:#174e7b}.slot{color:#667788}@media(max-width:700px){.paper{width:100%;margin:0;padding:28px 20px}.meta{grid-template-columns:1fr}}@media print{body{background:#fff}.paper{width:100%;margin:0;box-shadow:none}}</style></head><body><main class="paper"><header class="head"><small>智财问策 · 报告模板</small><h1>企业债务风险评估报告</h1><p>模板版本 1.1.0</p><div class="meta"><div>企业名称 / 企业类别</div><div>报告编号 / 内容版本</div><div>评估时点 / 模型版本</div><div>数据版本 / 输入快照</div></div></header><section class="section"><h2>一、执行摘要</h2><div class="slot">综合评分、风险等级与总体结论</div></section><section class="section"><h2>二、风险诊断与调节因子</h2><div class="slot">重点指标、企业因子、适用性和业务解释</div></section><section class="section"><h2>三、财务指标与规则语义</h2><div class="slot">指标实际值、权重、得分和规则口径</div></section><section class="section"><h2>四、应对策略与行动状态</h2><div class="slot">管理建议、处置状态和决策引用</div></section><section class="section"><h2>五、版本与证据</h2><div class="slot">模型、数据、输入、核验和正式产物</div></section></main></body></html>
