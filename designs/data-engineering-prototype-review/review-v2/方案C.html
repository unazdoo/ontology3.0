<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="design_doc_mode" content="prototype" />
  <title>数据工程评审原型 · 方案 C · 渐进展开关系卡片</title>
  <style>:root {
  --ink: #172336;
  --ink-2: #34445a;
  --muted: #68778a;
  --faint: #8a97a8;
  --line: #dce3eb;
  --line-strong: #c9d3df;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #edf2f7;
  --nav: #111c2a;
  --nav-2: #1a2a3c;
  --blue: #2e68d4;
  --blue-soft: #e9f0ff;
  --teal: #087f76;
  --teal-soft: #e2f5f2;
  --orange: #a46112;
  --orange-soft: #fff2dc;
  --red: #b53a44;
  --red-soft: #fdebed;
  --violet: #7153b6;
  --violet-soft: #f0ebff;
  --shadow: 0 10px 30px rgba(26, 42, 60, .08);
  --shadow-pop: 0 18px 60px rgba(17, 28, 42, .20);
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--surface-2); color: var(--ink); }
body { font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 14px; line-height: 1.65; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
.icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 18px; }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; clip: rect(0,0,0,0); overflow: hidden; }

.app-shell { min-height: 100vh; display: grid; grid-template-rows: 56px minmax(0, 1fr); }
.topbar { background: var(--nav); color: #eef4fb; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 18px; position: sticky; top: 0; z-index: 50; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark { width: 32px; height: 32px; border: 1px solid rgba(255,255,255,.14); background: #285cb2; display: grid; place-items: center; border-radius: 7px; }
.brand-copy { display: grid; line-height: 1.15; }
.brand-title { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.brand-sub { color: #9eb0c3; font-size: 12px; margin-top: 3px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.variant-chip { border: 1px solid #405065; background: #1b2a3b; color: #dce7f3; height: 32px; border-radius: 6px; padding: 0 11px; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
.variant-chip b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: var(--blue); color: white; }
.review-link { height: 32px; padding: 0 11px; border: 1px solid #405065; border-radius: 6px; display: inline-flex; gap: 7px; align-items: center; color: #dce7f3; }
.workspace { min-height: 0; display: grid; grid-template-columns: 196px minmax(0, 1fr); }
.sidenav { background: #f9fbfd; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; gap: 20px; }
.nav-kicker { font-size: 12px; color: var(--faint); font-weight: 650; padding: 0 10px; letter-spacing: .08em; }
.nav-list { display: grid; gap: 6px; }
.nav-link { min-height: 44px; display: flex; align-items: center; gap: 11px; padding: 0 12px; border-radius: 7px; color: var(--ink-2); font-weight: 630; font-size: 14px; border: 1px solid transparent; }
.nav-link:hover { background: #eef3f9; }
.nav-link.active { color: #1f55ba; background: #e8f0ff; border-color: #d6e2fb; }
.nav-link .count { margin-left: auto; color: var(--faint); font-size: 12px; font-weight: 600; }
.nav-context { margin-top: auto; border-top: 1px solid var(--line); padding: 16px 10px 0; color: var(--muted); font-size: 12px; }
.nav-context strong { color: var(--ink-2); display: block; font-size: 13px; margin-bottom: 4px; }
.main { min-width: 0; padding: 24px; }
.main.canvas-main { padding: 0; overflow: hidden; }
.page { width: 100%; max-width: 1600px; margin: 0 auto; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.page-title { font-size: clamp(22px, 1.7vw, 24px); line-height: 1.3; margin: 0; letter-spacing: -.02em; }
.page-subtitle { color: var(--muted); margin: 5px 0 0; font-size: 14px; }
.header-actions, .button-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.btn { height: 38px; border: 1px solid var(--line-strong); background: white; border-radius: 7px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; font-weight: 620; white-space: nowrap; transition: .16s ease; }
.btn:hover:not(:disabled) { border-color: #9badc2; box-shadow: 0 2px 8px rgba(24,40,60,.08); transform: translateY(-1px); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: white; }
.btn.soft { background: var(--blue-soft); border-color: #cbdafb; color: #2454ad; }
.btn.danger { background: var(--red-soft); border-color: #f1c8cc; color: var(--red); }
.btn:disabled { opacity: .46; cursor: not-allowed; }
.btn.icon-only { width: 38px; padding: 0; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { height: 42px; border: 0; background: transparent; padding: 0 15px; color: var(--muted); font-weight: 620; position: relative; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--blue); }
.tab.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--blue); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 25px; padding: 0 8px; border-radius: 999px; background: var(--surface-3); color: #526174; font-size: 12px; font-weight: 650; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .78; }
.badge.success { background: var(--teal-soft); color: #076f67; }
.badge.warning { background: var(--orange-soft); color: #8b560e; }
.badge.danger { background: var(--red-soft); color: #a32f3a; }
.badge.info { background: var(--blue-soft); color: #2457b7; }
.badge.violet { background: var(--violet-soft); color: #6246a1; }
.badge.neutral { background: #edf1f5; color: #667487; }
.badge.plain::before { display: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(24,40,60,.02); }
.panel-head { min-height: 54px; padding: 0 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-title { font-size: 17px; font-weight: 700; }
.panel-body { padding: 16px; }
.section-title { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.section-caption { color: var(--muted); font-size: 13px; }

.filterbar { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.search { position: relative; min-width: 210px; flex: 1; max-width: 360px; }
.search input { width: 100%; height: 38px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 12px 0 36px; background: #fbfcfe; }
.search .icon { position: absolute; left: 11px; top: 10px; color: var(--faint); }
.select { height: 38px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 30px 0 10px; background: white; min-width: 126px; }
.result-count { color: var(--muted); margin-left: auto; white-space: nowrap; }
.view-toggle { border: 1px solid var(--line-strong); border-radius: 7px; display: flex; padding: 2px; gap: 2px; background: var(--surface-2); }
.view-toggle button { width: 32px; height: 32px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.view-toggle button.active { background: white; color: var(--blue); box-shadow: 0 1px 4px rgba(24,40,60,.11); }

.resource-layout { display: grid; min-height: 560px; gap: 14px; }
.resource-layout.layout-a { grid-template-columns: minmax(390px, 1.15fr) 80px minmax(330px, .85fr); }
.resource-column { min-width: 0; }
.resource-column-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.resource-column-head h2 { font-size: 18px; margin: 0; }
.source-groups { display: grid; gap: 10px; }
.source-group { border: 1px solid var(--line); border-radius: 9px; background: white; overflow: hidden; }
.group-head { width: 100%; border: 0; background: #f9fbfd; min-height: 43px; display: flex; align-items: center; gap: 9px; padding: 0 12px; font-weight: 700; }
.group-head .muted { margin-left: auto; font-size: 12px; color: var(--muted); }
.group-cards { padding: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.group-cards.list-mode { grid-template-columns: 1fr; }
.resource-card { border: 1px solid var(--line); background: white; border-radius: 8px; padding: 13px; min-width: 0; text-align: left; position: relative; transition: .16s ease; }
.resource-card.interactive:hover { border-color: #a9bce1; box-shadow: 0 6px 18px rgba(30,64,120,.08); transform: translateY(-1px); }
.resource-card.selected { border-color: #7ba0e4; box-shadow: 0 0 0 2px rgba(46,104,212,.12); }
.resource-card.demo { background: #f9fafc; color: #58677a; }
.resource-card-title { display: flex; align-items: flex-start; gap: 9px; font-weight: 720; font-size: 15px; line-height: 1.4; }
.resource-card-title .icon { color: var(--blue); margin-top: 1px; }
.resource-card p { color: var(--muted); margin: 7px 0 10px; font-size: 13px; }
.fact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; }
.fact { min-width: 0; }
.fact-label { color: var(--faint); font-size: 12px; display: block; }
.fact-value { color: var(--ink-2); font-size: 13px; font-weight: 620; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #edf1f5; }
.card-link { border: 0; background: transparent; color: var(--blue); padding: 0; font-weight: 650; display: inline-flex; align-items: center; gap: 4px; }
.relationship-bridge { min-height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--faint); gap: 10px; }
.bridge-line { width: 100%; height: 2px; background: #cdd8e7; position: relative; }
.bridge-line::before, .bridge-line::after { content: ""; width: 8px; height: 8px; position: absolute; top: -3px; border-radius: 50%; background: #a8b6c9; }
.bridge-line::before { left: 0; }.bridge-line::after { right: 0; }
.relationship-bridge.active { color: var(--blue); }
.relationship-bridge.active .bridge-line { background: var(--blue); box-shadow: 0 0 0 4px rgba(46,104,212,.08); }
.relationship-bridge.active .bridge-line::before, .relationship-bridge.active .bridge-line::after { background: var(--blue); }
.asset-stack { display: grid; gap: 10px; }
.asset-card { background: white; border: 1px solid var(--line); border-radius: 9px; padding: 16px; transition: .16s ease; }
.asset-stack.list-mode .asset-card { padding: 12px 14px; }
.asset-stack.list-mode .asset-card .asset-members { margin: 8px 0; }
.asset-stack.list-mode .asset-card .fact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.asset-card.selected { border-color: #7ba0e4; box-shadow: 0 0 0 2px rgba(46,104,212,.12); }
.asset-card h3 { margin: 0; font-size: 17px; }
.asset-members { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.empty-asset { border: 1px dashed #c9d3df; border-radius: 9px; padding: 18px; color: var(--muted); background: #fbfcfe; }

.layout-b { grid-template-columns: 176px minmax(350px, .85fr) minmax(330px, 1.15fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: white; overflow: hidden; }
.category-rail { border-right: 1px solid var(--line); background: #f9fbfd; padding: 14px 10px; }
.category-rail h2 { font-size: 14px; margin: 0 8px 10px; }
.category-item { width: 100%; height: 42px; border: 0; background: transparent; border-radius: 7px; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--ink-2); }
.category-item span:last-child { margin-left: auto; color: var(--faint); }
.category-item.active { background: var(--blue-soft); color: #2457b7; font-weight: 680; }
.master-pane { border-right: 1px solid var(--line); padding: 14px; min-width: 0; }
.master-list { display: grid; gap: 8px; }
.master-list.cards-mode .resource-card { padding: 14px; }
.master-list.list-mode { align-content: start; }
.master-row { border: 1px solid var(--line); background: white; border-radius: 8px; text-align: left; padding: 12px; }
.master-row.selected { border-color: #7ba0e4; background: #f7faff; }
.master-row strong { display: block; font-size: 14px; }
.master-row small { color: var(--muted); font-size: 12px; }
.inspector-pane { padding: 18px; min-width: 0; background: linear-gradient(180deg, #fff, #fbfcfe); }
.inspector-hero { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.inspector-hero h2 { margin: 7px 0 4px; font-size: 19px; }
.inspector-hero p { color: var(--muted); margin: 0; }
.relation-summary { margin-top: 16px; padding: 13px; border-radius: 8px; background: var(--blue-soft); color: #2d579e; display: flex; align-items: center; gap: 10px; }

.layout-c { display: block; }
.view-switch-row { display: flex; justify-content: flex-end; align-items: center; gap: 18px; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
.view-switch-item { display: flex; align-items: center; gap: 8px; }
.focus-stage { display: grid; grid-template-columns: minmax(0, 1fr) 100px minmax(0, .85fr); align-items: stretch; gap: 14px; }
.focus-card { min-height: 320px; padding: 24px; border-radius: 12px; border: 1px solid var(--line); background: white; box-shadow: var(--shadow); }
.focus-card h2 { margin: 8px 0 7px; font-size: 22px; }
.focus-card .lead { color: var(--muted); max-width: 580px; }
.focus-card .fact-grid { margin-top: 24px; gap: 18px; }
.focus-bridge { display: grid; place-items: center; color: var(--blue); }
.focus-bridge .bridge-line { width: 100%; }
.resource-strip { margin-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.resource-strip.list-mode { grid-template-columns: 1fr; }
.strip-card { border: 1px solid var(--line); background: white; border-radius: 8px; padding: 12px; text-align: left; min-width: 0; }
.strip-card strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip-card span { color: var(--muted); font-size: 12px; }

.detail-hero { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; margin-bottom: 16px; }
.eyebrow { color: var(--blue); font-size: 12px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; }
.detail-hero h1 { margin: 5px 0 4px; font-size: 23px; }
.detail-hero p { color: var(--muted); margin: 0; }
.hero-status { min-width: 230px; border-left: 1px solid var(--line); padding-left: 20px; display: grid; align-content: center; gap: 7px; }
.content-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(270px, .7fr); gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; }
.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.summary-tile { background: #f8fafc; border: 1px solid #e6ebf1; border-radius: 8px; padding: 12px; }
.summary-tile span { color: var(--muted); font-size: 12px; display: block; }
.summary-tile strong { font-size: 15px; display: block; margin-top: 4px; }
.member-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.member-tab { border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 11px; background: white; font-size: 13px; }
.member-tab.active { background: var(--blue-soft); border-color: #bdd0f5; color: #2457b7; font-weight: 680; }
.member-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.member-card h3 { margin: 0 0 10px; font-size: 16px; }
.member-card ul { margin: 10px 0 0; padding-left: 19px; color: var(--ink-2); }
.member-card li { margin: 4px 0; }
.notice { border: 1px solid #cbdafb; background: #f3f7ff; color: #2f5596; border-radius: 8px; padding: 12px 14px; display: flex; gap: 9px; align-items: flex-start; }
.notice.warning { background: var(--orange-soft); border-color: #efd29f; color: #7b4b0a; }
.notice.danger { background: var(--red-soft); border-color: #efc4c9; color: #942c36; }
.notice.success { background: var(--teal-soft); border-color: #b8e3dc; color: #09665f; }
.quality-groups { display: grid; gap: 10px; }
.quality-group { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.quality-group-head { padding: 11px 13px; background: #fafbfd; display: flex; align-items: center; justify-content: space-between; }
.check-row { border-top: 1px solid var(--line); padding: 12px 13px; display: grid; grid-template-columns: minmax(160px, .9fr) minmax(240px, 1.4fr) auto; gap: 12px; align-items: center; }
.check-row strong { font-size: 14px; }
.check-row p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.evidence-button { border: 0; background: transparent; color: var(--blue); font-weight: 650; white-space: nowrap; }
.data-table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.data-table { width: 100%; border-collapse: collapse; min-width: 640px; }
.data-table th { text-align: left; background: #f4f7fa; color: #58677a; font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table td { padding: 11px 12px; border-bottom: 1px solid #edf1f5; vertical-align: top; font-size: 13px; }
.data-table tr:last-child td { border-bottom: 0; }
details.evidence { border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; }
details.evidence summary { padding: 12px 14px; cursor: pointer; font-weight: 680; }
details.evidence .evidence-body { padding: 0 14px 14px; color: var(--muted); overflow-wrap: anywhere; }

.pipeline-page .tabs { margin-bottom: 14px; }
.pipeline-list { display: grid; gap: 10px; }
.pipeline-card { background: white; border: 1px solid var(--line); border-radius: 9px; padding: 16px; display: grid; grid-template-columns: minmax(260px, 1.1fr) minmax(300px, 1fr) auto; gap: 18px; align-items: center; }
.pipeline-card h3 { margin: 0 0 4px; font-size: 17px; }
.pipeline-card p { color: var(--muted); margin: 0; }
.pipeline-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.pipeline-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }

.canvas-shell { height: calc(100vh - 56px); min-height: 650px; display: grid; grid-template-rows: 58px minmax(0, 1fr); background: #e8edf3; }
.canvas-toolbar { background: white; border-bottom: 1px solid var(--line); padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.canvas-title { min-width: 0; }
.canvas-title-line { display: flex; align-items: center; gap: 8px; }
.canvas-title h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-state { color: var(--teal); font-size: 12px; }
.canvas-actions { display: flex; align-items: center; gap: 7px; }
.canvas-workbench { min-height: 0; display: grid; grid-template-columns: 178px minmax(0, 1fr) 316px; }
.node-library { background: #f8fafc; border-right: 1px solid var(--line); padding: 14px 11px; min-width: 0; }
.node-library h2 { font-size: 14px; margin: 0 0 4px; }
.node-library p { color: var(--muted); margin: 0 0 12px; font-size: 12px; }
.library-list { display: grid; gap: 8px; }
.library-node { border: 1px solid var(--line-strong); background: white; min-height: 58px; border-radius: 7px; display: flex; align-items: center; gap: 9px; padding: 9px; text-align: left; }
.library-node .node-icon { width: 30px; height: 30px; }
.library-node strong { display: block; font-size: 13px; }.library-node small { color: var(--muted); font-size: 12px; }
.canvas-stage { min-width: 0; min-height: 0; position: relative; overflow: auto; background-color: #edf2f7; background-image: radial-gradient(#cbd5e0 1px, transparent 1px); background-size: 20px 20px; }
.canvas-status { position: sticky; z-index: 4; top: 10px; left: 10px; display: inline-flex; gap: 8px; align-items: center; margin: 10px; padding: 7px 10px; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 4px 12px rgba(24,40,60,.07); }
.flow { min-width: 650px; height: calc(100% - 62px); min-height: 390px; display: flex; align-items: center; justify-content: center; padding: 50px 28px 90px; gap: 0; }
.flow-node { width: 154px; min-height: 132px; background: white; border: 1px solid #bfcbd9; border-top: 3px solid var(--node-color); border-radius: 7px; padding: 12px; box-shadow: 0 4px 14px rgba(28,44,64,.07); text-align: left; position: relative; transition: .2s ease; }
.flow-node:hover, .flow-node.selected { border-color: var(--node-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--node-color) 14%, transparent), 0 8px 20px rgba(28,44,64,.10); transform: translateY(-2px); }
.flow-node .node-number { color: var(--node-color); font-size: 12px; font-weight: 780; }
.flow-node h3 { font-size: 14px; margin: 4px 0 6px; }
.flow-node p { color: var(--muted); font-size: 12px; margin: 0; line-height: 1.45; min-height: 34px; }

    return `<aside class="inspector"><div class="inspector-head"><div><h2>${def.name}</h2><p>${def.hint}</p></div>${badge(nodeStatus(node,preset,isS003).label,nodeStatus(node,preset,isS003).tone==="failed"?"danger":nodeStatus(node,preset,isS003).tone==="success"?"success":"neutral")}</div>${inspectorTabs(node,tab)}${body}${node==="publish"&&!isS003?`<div class="handoff"><h3>发布后交接（非画布节点）</h3><p>数据工程创建并提交 C028 / T050；本体管理拥有 C029 / T051 结果并唯一提交 T019。交接区只读展示回执和结果。</p></div>`:""}</aside>`;
  }
  function sourcePicker(isS003) {
    return `<div class="modal-backdrop" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-label="选择数据源"><div class="modal-head"><div><h2>选择数据源</h2><span class="section-caption">真实来源；资产复用仍为 CR-DE-007 候选</span></div><button class="btn icon-only" data-action="close-overlay" aria-label="关闭">${icon("close")}</button></div><div class="modal-body"><label class="search" style="display:block;max-width:none">${icon("search")}<input placeholder="搜索已登记来源或数据资产" /></label><div class="picker-list">${D.sources.map(s=>`<button class="picker-row" ${isS003||s.authenticity==="demo"||s.id==="src-s003-workbook"?"disabled":""}><div><h3>${s.name}</h3><p>${s.type} · ${s.scene} · ${s.contents}</p></div>${badge(isS003?(s.id==="src-s003-workbook"?"待真实快照":"不属于此管道"):s.authenticity==="demo"?"演示连接器":s.id==="src-s003-workbook"?"无真实快照":"可用",!isS003&&s.id==="src-finance-upload"?"success":"neutral")}</button>`).join("")}<button class="picker-row" disabled><div><h3>融资标准化数据资产</h3><p>已发布数据资产 · 4 个成员 · 数据截至 2026-08-08</p></div>${badge(isS003?"S003 范围禁用资产复用":"同 T006 自循环禁止","neutral")}</button></div><div class="notice" style="margin-top:12px">${icon("info")}<span>跨管道复用须待 CR-DE-007 收敛并通过兼容性校验；当前选择器不提供可执行入口。</span></div></div><div class="modal-foot">${button("取消","close-overlay")}${button("确认选择","picker-confirm","primary","check",isS003)}</div></section></div>`;
  }
  function publishConfirm() {
    return `<div class="modal-backdrop" data-overlay="true"><section class="modal small" role="dialog" aria-modal="true" aria-label="发布前确认"><div class="modal-head"><h2>确认发布不可变数据资产</h2><button class="btn icon-only" data-action="close-overlay">${icon("close")}</button></div><div class="modal-body"><div class="notice warning">${icon("alert")}<span>发布后该版本内容不可修改。后续更正将形成新版本。</span></div><div class="confirm-list"><div class="confirm-row"><span>资产</span><strong>融资标准化数据资产</strong></div><div class="confirm-row"><span>数据截至</span><strong>2026-08-08</strong></div><div class="confirm-row"><span>成员结构</span><strong>四成员 · 三关系</strong></div><div class="confirm-row"><span>质量结论</span><strong>有警告 · 已人工确认</strong></div><div class="confirm-row"><span>来源证据</span><strong>1 个精确快照</strong></div><div class="confirm-row"><span>发布后交接</span><strong>数据工程提交 C028 / T050；结果只读回显</strong></div></div><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="publish-check" /> <span>我已核对将发布的成员、粒度、稳定键、质量和来源。</span></label></div><div class="modal-foot">${button("返回检查","close-overlay")}${button("确认发布","confirm-publish","primary","package")}</div></section></div>`;
  }
  function canvasPage(id) {
    const p=D.pipelines.find(x=>x.id===id)||D.pipelines[0]; const isS003=id==="pipe-s003-compat"; const r=routeInfo();
    const preset=r.params.get("preset")||(isS003?"s003-never-run":"default"); const node=r.params.get("node")||"source"; const tab=r.params.get("nodeTab")||r.params.get("panel")||"config"; const overlay=r.params.get("overlay");
    return shell(`<div class="canvas-shell ${preset==="running"||preset==="debug-running"?"is-running":""}" data-screen-label="管道画布">${canvasToolbar(p,isS003,preset)}<div class="canvas-workbench">${nodeLibrary()}${canvasFlow(p,preset,node,isS003)}${inspector(p,isS003,preset,node,tab)}</div></div>${overlay==="source-picker"?sourcePicker(isS003):overlay==="publish-confirm"&&!isS003?publishConfirm():""}`,true);
  }

  function render() {
    const r=routeInfo(); const p=r.parts; let html;
    if(p[0]==="resources"&&p[1]==="source") html=sourceDetail(p[2]);
    else if(p[0]==="resources"&&p[1]==="asset") html=assetDetail();
    else if(p[0]==="pipelines"&&p[2]==="canvas") html=canvasPage(p[1]);
    else if(p[0]==="pipelines"&&p[2]==="runs"&&p[3]) html=runDetail(p[3]);
    else if(p[0]==="pipelines") html=pipelinesHome();
    else html=renderResourceDirectory();
    root.innerHTML=html;
    const type=document.getElementById("filter-type"), status=document.getElementById("filter-status"), scene=document.getElementById("filter-scene");
    if(type)type.value=ui.type;if(status)status.value=ui.status;if(scene)scene.value=ui.scene;
  }

  document.addEventListener("click", function(e) {
    const el=e.target.closest("[data-action]"); if(!el) return; const action=el.dataset.action;
    if(el.disabled) return;
    if(action==="view") { if(el.dataset.kind==="source")ui.sourceView=el.dataset.value;else ui.assetView=el.dataset.value;render(); }
    else if(action==="toggle-group") { ui.collapsedGroups.has(el.dataset.group)?ui.collapsedGroups.delete(el.dataset.group):ui.collapsedGroups.add(el.dataset.group);render(); }
    else if(action==="select-resource") { ui.selectedResource=el.dataset.id;render(); }
    else if(action==="open-source") navigate(`#/resources/source/${el.dataset.id}?tab=${el.dataset.id==="src-s003-workbook"?"compatibility":"summary"}`);
    else if(action==="open-asset") navigate("#/resources/asset/asset-finance?tab=summary");
    else if(action==="detail-tab") navigate(routeWith({tab:el.dataset.value}));
    else if(action==="asset-tab") navigate(routeWith({tab:el.dataset.value}));
    else if(action==="member") { ui.member=el.dataset.value;render(); }
    else if(action==="s003-member") { ui.s003Member=el.dataset.value;render(); }
    else if(action==="pipeline-tab") navigate(`#/pipelines?tab=${el.dataset.value}`);
    else if(action==="open-pipeline") navigate(`#/pipelines/${el.dataset.id}/canvas?preset=${el.dataset.id==="pipe-s003-compat"?"s003-never-run":"default"}&node=source&panel=config`);
    else if(action==="open-s003-pipeline") navigate("#/pipelines/pipe-s003-compat/canvas?preset=s003-never-run&node=source&panel=config");
    else if(action==="select-node") navigate(routeWith({node:el.dataset.node,panel:"config",nodeTab:null,overlay:null}));
    else if(action==="node-tab") navigate(routeWith({nodeTab:el.dataset.value,panel:null}));
    else if(action==="source-picker") navigate(routeWith({overlay:"source-picker"}));
    else if(action==="close-overlay") navigate(routeWith({overlay:null}));
    else if(action==="publish") navigate(routeWith({overlay:"publish-confirm"}));
    else if(action==="confirm-warning") navigate(routeWith({preset:"publish-ready",node:"publish",panel:"config",nodeTab:null}));
    else if(action==="debug") { navigate(routeWith({preset:"debug-running",node:"python",panel:"result",nodeTab:null})); clearTimeout(runTimer); runTimer=setTimeout(()=>navigate(routeWith({preset:"debug-complete",node:"python",panel:"result",nodeTab:null})),1600); }
    else if(action==="run") { navigate(routeWith({preset:"running",node:"python",panel:"result",nodeTab:null})); clearTimeout(runTimer); runTimer=setTimeout(()=>navigate(routeWith({preset:"quality-warning",node:"quality",panel:"result",nodeTab:null})),1800); }
    else if(action==="retry") navigate(routeWith({preset:"running",node:"quality",panel:"result"}));
    else if(action==="open-failure") navigate("#/pipelines/pipe-finance/canvas?preset=quality-failed&node=quality&panel=result");
    else if(action==="confirm-publish") { const cb=document.getElementById("publish-check"); if(!cb||!cb.checked){showToast("请先确认已核对发布内容");}else{navigate(routeWith({overlay:null}));setTimeout(()=>showToast("评审交互已完成：不会创建真实资产版本"),40);} }
    else if(action==="picker-confirm") { navigate(routeWith({overlay:null}));setTimeout(()=>showToast("已选择融资明细一览表"),30); }
    else if(action==="zoom") { ui.zoom=Math.max(70,Math.min(130,ui.zoom+Number(el.dataset.value)));render(); }
    else if(action==="fit") { ui.zoom=100;showToast("画布已适应窗口"); }
    else if(action==="save") showToast(routeInfo().parts[1]==="pipe-s003-compat"?"S003 仅为评审结构，不能保存为 T003":"管道配置已保存（评审交互）");
    else if(action==="undo") showToast("没有可撤销的修改");
    else if(action==="upload") navigate("#/resources/source/src-finance-upload?tab=summary&overlay=upload");
    else if(action==="upload-confirm") showToast("评审原型不读取文件；真实产品将在校验后登记快照");
    else if(action==="shared-folder") navigate(routeInfo().parts[1]==="source"?routeWith({overlay:"shared-folder"}):"#/resources/source/src-finance-upload?tab=summary&overlay=shared-folder");
    else if(action==="folder-test") showToast("访问测试交互已触发；原型不伪造测试成功结果");
    else if(action==="folder-save") showToast("共享文件夹设置已保存（评审交互）");
    else if(action==="folder-check") showToast("真实产品将启动一次完整检查；原型不生成快照或运行");
    else if(action==="folder-pause") showToast("来源保持暂停，不存在定时检查计划");
    else if(action==="evidence") showToast("已展开对应工作簿核验证据");
    else if(action==="run-detail") navigate(`#/pipelines/pipe-finance/runs/${el.dataset.id}`);
    else if(action==="back-runs") navigate("#/pipelines?tab=runs");
    else if(action==="toast") showToast(el.dataset.message||"操作已记录");
    else if(action==="category") { ui.type=el.dataset.value==="全部资源"?"全部来源":el.dataset.value==="手工上传"?"手工工作簿":el.dataset.value;const visible=filteredSources();if(!visible.some(x=>x.id===ui.selectedResource))ui.selectedResource=visible[0]?.id||"";render(); }
  });
  document.addEventListener("input", function(e){ if(e.target.id==="resource-search"){ui.query=e.target.value;const visible=filteredSources();if(!visible.some(x=>x.id===ui.selectedResource))ui.selectedResource=visible[0]?.id||"";render();const n=document.getElementById("resource-search");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}} });
  document.addEventListener("change", function(e){ if(e.target.id==="filter-type")ui.type=e.target.value;else if(e.target.id==="filter-status")ui.status=e.target.value;else if(e.target.id==="filter-scene")ui.scene=e.target.value;else return;const visible=filteredSources();if(!visible.some(x=>x.id===ui.selectedResource))ui.selectedResource=visible[0]?.id||"";render(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape"&&routeInfo().params.get("overlay")){navigate(routeWith({overlay:null}));} if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();showToast(routeInfo().parts[1]==="pipe-s003-compat"?"S003 仅为评审结构，不能保存为 T003":"管道配置已保存（评审交互）");} });
  window.addEventListener("hashchange",render);
  window.addEventListener("popstate",render);
  if(!location.hash) history.replaceState(null,"","#/resources");
  render();
})();
</script>
</body>
</html>
