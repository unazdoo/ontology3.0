<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="design_doc_mode" content="canvas" />
  <title>数据工程 · 三版逐页对比</title>
  <style>:root{--ink:#172336;--muted:#68778a;--line:#dce3eb;--surface:#fff;--bg:#eef2f6;--nav:#111c2a;--blue:#2e68d4;--green:#087f76}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;font-size:14px;overflow-x:hidden}button,select{font:inherit}.top{min-height:58px;background:var(--nav);color:white;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;position:sticky;top:0;z-index:5}.title{display:flex;align-items:center;gap:12px}.mark{width:32px;height:32px;border-radius:7px;background:#285cb2;display:grid;place-items:center;font-weight:800}.title h1{font-size:16px;margin:0}.title p{color:#a7b5c5;font-size:12px;margin:2px 0 0}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls select,.controls button{height:36px;border-radius:7px;border:1px solid #415168;background:#1b2a3b;color:#edf4fb;padding:0 11px}.controls select{min-width:210px}.controls button.primary{background:#2e68d4;border-color:#2e68d4}.layout-toggle{display:flex;padding:2px;border:1px solid #415168;border-radius:7px;background:#1b2a3b}.layout-toggle button{height:30px;border:0;background:transparent;padding:0 10px}.layout-toggle button.active{background:#edf4fb;color:#172336}.context{background:white;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.context strong{font-size:15px}.context span{color:var(--muted)}.boards{padding:14px;display:grid;gap:14px}.boards.readable{grid-template-columns:1fr;max-width:1440px;margin:0 auto}.boards.compact{grid-template-columns:repeat(3,minmax(0,1fr));max-width:none}.board{min-width:0;background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 7px 24px rgba(23,35,54,.06)}.board-head{min-height:64px;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.variant{display:flex;align-items:center;gap:9px;min-width:0}.variant-key{width:28px;height:28px;border-radius:6px;color:white;background:#2e68d4;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.board:nth-child(2) .variant-key{background:#3c61c6}.board:nth-child(3) .variant-key{background:#276a72}.variant strong{font-size:14px;display:block}.variant small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}.board-actions{display:flex;gap:6px;flex:0 0 auto}.board-actions a,.choose{height:30px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:0 8px;display:inline-flex;align-items:center;text-decoration:none;font-size:12px;cursor:pointer;white-space:nowrap}.choose.selected{border-color:#98d1c9;background:#e2f5f2;color:#076f67}.frame-wrap{height:720px;background:#f4f7fa;position:relative;overflow:hidden}.frame-wrap iframe{width:100%;height:100%;border:0;background:white}.boards.compact .board-head{min-height:92px;display:grid;align-content:center;justify-content:stretch}.boards.compact .variant small{max-width:100%}.boards.compact .board-actions{justify-content:flex-start}.boards.compact .frame-wrap{height:240px}.boards.compact .frame-wrap iframe{width:1280px;height:720px;transform-origin:top left}.selection{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#142236;color:white;border-radius:8px;padding:10px 14px;box-shadow:0 14px 40px rgba(15,26,42,.22);display:none;z-index:8}.selection.show{display:block}.note{color:var(--muted);font-size:12px}@media(max-width:1050px){.top{align-items:flex-start;flex-direction:column}.boards.compact{grid-template-columns:1fr}.frame-wrap,.boards.compact .frame-wrap{height:680px}.boards.compact .frame-wrap iframe{width:100%;height:100%;transform:none!important}.context{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
  <div id="compare"></div>
  <script>window.DE_MANIFEST={"version":"review-v2.0","fixtureHash":"de-s001-s003-20260810","variants":[{"key":"A","title":"方案 A · 双栏关系目录","focus":"一眼看清来源、资产与引用关系","layout":"dual-relation"},{"key":"B","title":"方案 B · 主从三栏工作台","focus":"适合资源数量增长后的检索与管理","layout":"master-detail"},{"key":"C","title":"方案 C · 渐进展开关系卡片","focus":"低密度表达，适合业务演示与非技术用户","layout":"focus-cards"}],"screens":[{"id":"resource-directory","label":"数据资源目录","route":"#/resources"},{"id":"manual-source-detail","label":"手工上传数据源详情","route":"#/resources/source/src-finance-upload?tab=summary"},{"id":"s003-source-detail","label":"S003 兼容性详情","route":"#/resources/source/src-s003-workbook?tab=compatibility"},{"id":"asset-detail","label":"数据资产详情","route":"#/resources/asset/asset-finance?tab=summary"},{"id":"pipeline-list","label":"数据管道列表","route":"#/pipelines?tab=list"},{"id":"run-history","label":"运行历史","route":"#/pipelines?tab=runs"},{"id":"canvas-default","label":"管道画布默认态","route":"#/pipelines/pipe-finance/canvas?preset=default"},{"id":"source-node-config","label":"数据源节点配置","route":"#/pipelines/pipe-finance/canvas?preset=default&node=source&panel=config&overlay=source-picker"},{"id":"python-node-config","label":"Python 节点配置与代码","route":"#/pipelines/pipe-finance/canvas?preset=default&node=python&panel=config&nodeTab=code"},{"id":"quality-result","label":"数据检查结果","route":"#/pipelines/pipe-finance/canvas?preset=quality-warning&node=quality&panel=result"},{"id":"publish-config","label":"发布数据资产配置","route":"#/pipelines/pipe-finance/canvas?preset=default&node=publish&panel=config"},{"id":"running","label":"运行中","route":"#/pipelines/pipe-finance/canvas?preset=running&node=python&panel=result"},{"id":"quality-failed","label":"质量失败","route":"#/pipelines/pipe-finance/canvas?preset=quality-failed&node=quality&panel=result"},{"id":"publish-confirm","label":"发布前确认","route":"#/pipelines/pipe-finance/canvas?preset=publish-ready&node=publish&overlay=publish-confirm"}],"invariants":{"primaryNavigation":["数据资源","数据管道"],"pipelineCount":2,"financeNodeCount":4,"s003NodeCount":4,"s003RunCount":0,"s003PublishedAssetCount":0,"s003Consumption":"不可消费"},"entries":[{"source":"shared/shell.html","output":"方案A.html","variant":"A"},{"source":"shared/shell.html","output":"方案B.html","variant":"B"},{"source":"shared/shell.html","output":"方案C.html","variant":"C"},{"source":"shared/compare-shell.html","output":"逐页对比.html","variant":"COMPARE"}]};</script>
  <script>(function(){
  const M=window.DE_MANIFEST,root=document.getElementById("compare");
  const variants=M.variants;let screen=M.screens[0];let chosen=null;let layout="readable";
  try{const saved=JSON.parse(localStorage.getItem("de.review-v2.choice")||"null");if(saved&&saved.variant)chosen=saved.variant;}catch(e){}
  function esc(x){return String(x).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function entry(v){return `方案${v}.html${screen.route}`;}
  function fitCompactFrames(){if(layout!=="compact"||matchMedia("(max-width:1050px)").matches)return;document.querySelectorAll(".frame-wrap").forEach(w=>{const f=w.querySelector("iframe");const scale=Math.min(1,w.clientWidth/1280);f.style.transform=`scale(${scale})`;w.style.height=`${Math.round(720*scale)}px`;});}
  function render(){root.innerHTML=`<header class="top"><div class="title"><span class="mark">DE</span><div><h1>数据工程 · 三版逐页对比</h1><p>相同业务内核、相同状态口径，只比较信息架构与交互表达</p></div></div><div class="controls"><div class="layout-toggle" role="group" aria-label="对比布局"><button data-layout="readable" class="${layout==="readable"?"active":""}">逐版阅读</button><button data-layout="compact" class="${layout==="compact"?"active":""}">三版缩略</button></div><label>评审页面 <select id="screen-select">${M.screens.map(s=>`<option value="${s.id}" ${s.id===screen.id?"selected":""}>${esc(s.label)}</option>`).join("")}</select></label><button id="previous">上一页</button><button id="next" class="primary">下一页</button></div></header><div class="context"><div><strong>${esc(screen.label)}</strong> <span>· 第 ${M.screens.indexOf(screen)+1} / ${M.screens.length} 页</span></div><span class="note">逐版阅读用于核对文字和交互；三版缩略用于比较整体布局。“选择此版”不改变业务状态。</span></div><main class="boards ${layout}">${variants.map(v=>`<section class="board"><div class="board-head"><div class="variant"><span class="variant-key">${v.key}</span><div><strong>${esc(v.title)}</strong><small>${esc(v.focus)}</small></div></div><div class="board-actions"><button class="choose ${chosen===v.key?"selected":""}" data-choose="${v.key}">${chosen===v.key?"已选择":"选择此版"}</button><a href="${entry(v.key)}" target="_blank">打开完整方案</a></div></div><div class="frame-wrap"><iframe title="${esc(v.title)} · ${esc(screen.label)}" src="${entry(v.key)}"></iframe></div></section>`).join("")}</main><div class="selection" id="selection"></div>`;document.querySelectorAll("iframe").forEach(f=>f.addEventListener("load",fitCompactFrames,{once:true}));requestAnimationFrame(fitCompactFrames);}
  function switchTo(index){const next=Math.max(0,Math.min(M.screens.length-1,index));screen=M.screens[next];render();}
  document.addEventListener("change",e=>{if(e.target.id==="screen-select"){screen=M.screens.find(s=>s.id===e.target.value)||M.screens[0];render();}});
  document.addEventListener("click",e=>{const layoutButton=e.target.closest("[data-layout]");if(layoutButton){layout=layoutButton.dataset.layout;render();return;}if(e.target.id==="previous")switchTo(M.screens.indexOf(screen)-1);else if(e.target.id==="next")switchTo(M.screens.indexOf(screen)+1);else{const b=e.target.closest("[data-choose]");if(b){chosen=b.dataset.choose;localStorage.setItem("de.review-v2.choice",JSON.stringify({pageId:screen.id,variant:chosen,selectedAt:new Date().toISOString()}));render();const n=document.getElementById("selection");n.textContent=`已记录：${screen.label}选择方案 ${chosen}`;n.classList.add("show");setTimeout(()=>n&&n.classList.remove("show"),2200);}}});
  window.addEventListener("resize",fitCompactFrames);
  render();
})();
</script>
</body>
</html>
