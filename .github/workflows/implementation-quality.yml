name: implementation-quality

on:
  pull_request:
    branches:
      - main
      - codex/implementation-quality-release
      - implementation-quality-release
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      candidate:
        description: Require implementation-candidate eligibility
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: implementation-quality-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  QUALITY_GATE_MANIFEST: implementation/evidence/pr-quality.json
  BASELINE_SNAPSHOT_ID: BSL-OFW-V110-94ABD0E991B7
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  IMPLEMENTATION_ROUND_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  foundation-and-contracts:
    name: foundation-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run foundation and module tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Run quality-gate unit tests
        run: npm run test:quality
      - name: Verify migration and persistence contracts
        run: node --test infra/runbook.test.cjs infra/migrate-runtime.test.mjs infra/runtime/postgres-runtime-persistence.test.cjs
      - name: Verify redacted S001 golden data
        run: node scripts/quality-gate/verify-golden-data.mjs --report artifacts/golden-data.json
      - name: Verify immutable baselineSnapshotId
        run: node scripts/quality-gate/verify-baseline-reference.mjs
      - name: Generate and verify SPDX SBOM
        run: |
          node scripts/quality-gate/generate-sbom.mjs --output artifacts/sbom.spdx.json
          node scripts/quality-gate/verify-sbom.mjs --sbom artifacts/sbom.spdx.json --report artifacts/sbom-verification.json
      - name: Scan tracked files for secrets
        run: node scripts/quality-gate/scan-security.mjs --output artifacts/security-scan.json
      - name: Audit resolved production dependencies
        run: npm audit --audit-level=high --omit=dev --json > artifacts/npm-audit.json
      - name: Upload foundation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-quality-foundation-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn

  scenario-regression:
    name: s001-contract-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run C034 and S001 foundation regression
        run: node --test designs/prototype-releases/v1.1.0/foundation/ofw-scenario-foundation.test.cjs packages/checkpoint/index.test.cjs
      - name: Run contract compatibility tests
        run: node --test packages/contracts/test/contracts.test.js packages/foundation-contract.test.cjs
      - name: Record prototype boundary
        run: |
          mkdir -p artifacts
          node -e 'const fs=require("fs"); fs.writeFileSync("artifacts/prototype-boundary.json", JSON.stringify({status:"passed",evidence:"artifact://prototype-boundary.json",productionEvidence:false},null,2));'
      - name: Upload regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-quality-regression-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn

  real-pr-quality:
    name: real-pr-runtime-evidence
    needs: foundation-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ofw_ci_admin
          POSTGRES_PASSWORD: ofw_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: ofw_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofw_ci_admin -d ofw_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PR_PROVIDER_MINIO_ENDPOINT: http://127.0.0.1:9000
      PR_PROVIDER_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Ensure PostgreSQL client is available
        shell: bash
        run: command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install --yes postgresql-client; }
      - name: Start isolated MinIO and NATS JetStream
        id: containers
        shell: bash
        run: |
          set -euo pipefail
          MINIO_USER="ci$(openssl rand -hex 8)"
          MINIO_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          NATS_USER="ci$(openssl rand -hex 8)"
          NATS_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          export PR_PROVIDER_NATS_USER="$NATS_USER"
          export PR_PROVIDER_NATS_PASSWORD="$NATS_PASSWORD"
          echo "::add-mask::$MINIO_USER"
          echo "::add-mask::$MINIO_PASSWORD"
          echo "::add-mask::$NATS_USER"
          echo "::add-mask::$NATS_PASSWORD"
          {
            echo "PR_PROVIDER_MINIO_ACCESS_KEY=$MINIO_USER"
            echo "PR_PROVIDER_MINIO_SECRET_KEY=$MINIO_PASSWORD"
            echo "PR_PROVIDER_NATS_USER=$NATS_USER"
            echo "PR_PROVIDER_NATS_PASSWORD=$NATS_PASSWORD"
            echo "MINIO_CONTAINER=ofw-minio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "NATS_CONTAINER=ofw-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
          node scripts/quality-gate/provision-pr-environment.mjs \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --prepare-runtime-identities \
            --nats-config-output "$RUNNER_TEMP/ofw-nats.conf"
          docker run --detach --name "ofw-minio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --publish 9000:9000 --publish 9001:9001 \
            --env "MINIO_ROOT_USER=$MINIO_USER" --env "MINIO_ROOT_PASSWORD=$MINIO_PASSWORD" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --console-address ':9001'
          docker run --detach --name "ofw-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --publish 4222:4222 --publish 8222:8222 \
            --volume "$RUNNER_TEMP/ofw-nats.conf:/etc/nats/ofw.conf:ro" \
            nats:2.10.26-alpine -c /etc/nats/ofw.conf
      - name: Verify PostgreSQL 16, MinIO and JetStream health
        shell: bash
        env:
          PR_PROVIDER_POSTGRES_URL: postgresql://ofw_ci_admin:ofw_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/ofw_ci
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.PR_PROVIDER_POSTGRES_URL });
            await client.connect();
            const result = await client.query('show server_version');
            if (!String(result.rows[0].server_version).startsWith('16.')) throw new Error(`expected PostgreSQL 16, got ${result.rows[0].server_version}`);
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null && break
            test "$attempt" -lt 60 || exit 1
            sleep 1
          done
          for attempt in $(seq 1 60); do
            curl --fail --silent 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null && break
            test "$attempt" -lt 60 || exit 1
            sleep 1
          done
      - name: Provision exact PR resources and short-lived credentials
        id: environment
        env:
          PR_PROVIDER_POSTGRES_URL: postgresql://ofw_ci_admin:ofw_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/ofw_ci
        run: |
          mkdir -p artifacts/receipts
          node scripts/quality-gate/provision-pr-environment.mjs \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --live --round-id "$IMPLEMENTATION_ROUND_ID" --lease-seconds 3600 \
            --output artifacts/receipts/pr-environment.json \
            --receipt-output artifacts/receipts/provisioning.json \
            --github-output
      - name: Map short-lived PostgreSQL lease to migration variables
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const url = new URL(process.env.PR_DATABASE_URL);
          const values = {
            PR_PGHOST: url.hostname,
            PR_PGPORT: url.port || '5432',
            PR_PGDATABASE: url.pathname.slice(1),
            PR_PGUSER: decodeURIComponent(url.username),
            PR_PGPASSWORD: decodeURIComponent(url.password),
            PR_PGSSLMODE: 'disable'
          };
          process.stdout.write(`::add-mask::${values.PR_PGPASSWORD}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key,value]) => `${key}=${value}`).join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Exercise isolated migration up and down
        shell: bash
        run: |
          set -euo pipefail
          node infra/migrate-runtime.mjs up --pr-schema "$PR_DB_SCHEMA" --receipt artifacts/receipts/migration-up-preflight.json
          ALLOW_ISOLATED_RUNTIME_DOWN=1 node infra/migrate-runtime.mjs down --pr-schema "$PR_DB_SCHEMA" --receipt artifacts/receipts/migration-down.json
      - name: Recreate exact owner schemas after rollback exercise
        env:
          PR_PROVIDER_POSTGRES_URL: postgresql://ofw_ci_admin:ofw_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/ofw_ci
        run: |
          node --input-type=module - <<'NODE'
          import { Client } from 'pg';
          import fs from 'node:fs';
          const descriptor = JSON.parse(fs.readFileSync('artifacts/receipts/pr-environment.json', 'utf8'));
          const role = descriptor.resources.postgresRole;
          if (!/^pr_[1-9][0-9]*_[a-f0-9]{12}_app$/.test(role)) throw new Error('unsafe provider role');
          const client = new Client({ connectionString: process.env.PR_PROVIDER_POSTGRES_URL });
          await client.connect();
          try {
            for (const schema of descriptor.resources.moduleSchemas) {
              if (!/^pr_[1-9][0-9]*_[a-f0-9]{12}_m0[1-6]$/.test(schema)) throw new Error('unsafe module schema');
              await client.query(`CREATE SCHEMA "${schema}" AUTHORIZATION "${role}"`);
            }
          } finally { await client.end(); }
          NODE
      - name: Reapply runtime persistence migration
        run: node infra/migrate-runtime.mjs up --pr-schema "$PR_DB_SCHEMA" --receipt artifacts/receipts/migration-up.json
      - name: Run persisted S001, six handoffs and C034 recovery
        env:
          PR_RUNTIME_MINIO_ENDPOINT: http://127.0.0.1:9000
          PR_RUNTIME_NATS_URL: nats://127.0.0.1:4222
          PR_PROVIDER_POSTGRES_URL: ''
          PR_PROVIDER_MINIO_ACCESS_KEY: ''
          PR_PROVIDER_MINIO_SECRET_KEY: ''
          PR_PROVIDER_NATS_USER: ''
          PR_PROVIDER_NATS_PASSWORD: ''
        run: |
          node scripts/quality-gate/run-real-runtime-evidence.mjs \
            --descriptor artifacts/receipts/pr-environment.json \
            --provider-receipt artifacts/receipts/provisioning.json \
            --migration-up artifacts/receipts/migration-up.json \
            --migration-down artifacts/receipts/migration-down.json \
            --receipt-dir artifacts/receipts
      - name: Run actual WCAG and keyboard probe against the frozen reference
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory designs/prototype-releases/v1.1.0 > artifacts/receipts/accessibility-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/s001-e2e-integration/index.html >/dev/null && break
            test "$attempt" -lt 30 || exit 1
            sleep 1
          done
          node scripts/quality-gate/run-accessibility-evidence.mjs \
            --url 'http://127.0.0.1:4173/s001-e2e-integration/index.html#home' \
            --runtime artifacts/receipts/runtime.json \
            --focus-path quality-gates/accessibility/s001-focus-path.json \
            --output artifacts/receipts/accessibility.json \
            || echo 'Accessibility remains blocked; the final evidence gate will reject this candidate.'
      - name: Fingerprint actual MinIO objects
        env:
          PR_PROVIDER_POSTGRES_URL: postgresql://ofw_ci_admin:ofw_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/ofw_ci
        run: |
          node scripts/quality-gate/fingerprint-object-storage.mjs \
            --live --descriptor artifacts/receipts/pr-environment.json \
            --receipt artifacts/receipts/provisioning.json \
            --round-id "$IMPLEMENTATION_ROUND_ID" \
            --output artifacts/receipts/object-storage-fingerprint.json
      - name: Generate and verify digest-bound PR evidence
        run: |
          node scripts/quality-gate/generate-pr-evidence.mjs \
            --metadata artifacts/receipts/metadata.json \
            --index artifacts/receipts/index.json \
            --receipt-root "$GITHUB_WORKSPACE" \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --round-id "$IMPLEMENTATION_ROUND_ID" \
            --output "$QUALITY_GATE_MANIFEST"
          node scripts/quality-gate/verify-pr-evidence.mjs \
            --manifest "$QUALITY_GATE_MANIFEST" --receipt-root "$GITHUB_WORKSPACE" \
            --baseline "$BASELINE_SNAPSHOT_ID" \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --report artifacts/receipts/pr-quality-report.json
      - name: Cleanup exact PR resources
        if: always() && steps.environment.outcome == 'success'
        env:
          ALLOW_PR_ENV_CLEANUP: '1'
          PR_PROVIDER_POSTGRES_URL: postgresql://ofw_ci_admin:ofw_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/ofw_ci
        run: |
          node scripts/quality-gate/cleanup-pr-environment.mjs \
            --live --execute \
            --descriptor artifacts/receipts/pr-environment.json \
            --receipt artifacts/receipts/provisioning.json \
            --round-id "$IMPLEMENTATION_ROUND_ID" \
            --output artifacts/receipts/cleanup.json
      - name: Stop job-local service containers
        if: always()
        shell: bash
        run: |
          docker rm --force "ofw-minio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
          docker rm --force "ofw-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
      - name: Upload immutable runtime evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-quality-runtime-${{ github.run_id }}
          path: |
            artifacts/receipts/
            implementation/evidence/pr-quality.json
          retention-days: 90
          if-no-files-found: error

  named-quality-gates:
    name: named-quality-gates (${{ matrix.gate }})
    needs: real-pr-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate:
          - golden-data
          - contract-compatibility
          - e2e
          - permission-negative
          - concurrency-idempotency
          - performance
          - accessibility
          - security
          - sbom
          - observability
          - c034-recovery
          - migration
          - rollback
          - ci-cd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: implementation-quality-runtime-${{ github.run_id }}
          path: .
      - name: Verify ${{ matrix.gate }} receipt
        run: node scripts/quality-gate/verify-gate-receipt.mjs --manifest "$QUALITY_GATE_MANIFEST" --gate "${{ matrix.gate }}" --report "artifacts/${{ matrix.gate }}.json"
      - name: Upload named gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-quality-${{ matrix.gate }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn

  pr-evidence:
    name: pr-evidence-quality-gate
    needs: real-pr-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: implementation-quality-runtime-${{ github.run_id }}
          path: .
      - name: Validate evidence bundle
        run: |
          node scripts/quality-gate/verify-pr-evidence.mjs \
            --manifest "$QUALITY_GATE_MANIFEST" --receipt-root "$GITHUB_WORKSPACE" \
            --baseline "$BASELINE_SNAPSHOT_ID" \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --report artifacts/pr-quality-report.json --github-output
      - name: Upload PR quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-quality-evidence-${{ github.run_id }}
          path: artifacts/pr-quality-report.json
          retention-days: 90
          if-no-files-found: warn

  implementation-candidate:
    name: implementation-candidate-gate
    needs: [pr-evidence, scenario-regression, named-quality-gates]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.candidate == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'implementation-candidate'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: implementation-quality-runtime-${{ github.run_id }}
          path: .
      - name: Re-evaluate candidate conditions
        run: |
          node scripts/quality-gate/verify-pr-evidence.mjs \
            --manifest "$QUALITY_GATE_MANIFEST" --receipt-root "$GITHUB_WORKSPACE" \
            --baseline "$BASELINE_SNAPSHOT_ID" \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --candidate --report artifacts/candidate-report.json
      - name: Create implementation candidate manifest
        run: |
          node scripts/quality-gate/create-candidate-manifest.mjs \
            --evidence "$QUALITY_GATE_MANIFEST" \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --output artifacts/implementation-candidate.json
      - name: Upload candidate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-candidate-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn
